name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Fired by gupta-kush/kush-gupta-resume when Kush_Gupta_resume.pdf changes.
  # See docs/resume-sync-setup.md.
  repository_dispatch:
    types: [resume-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gate the resume-sync steps behind the secret. If RESUME_READ_TOKEN
      # isn't set yet, the build falls back to the committed
      # public/resume.pdf instead of breaking.
      - name: Check resume sync availability
        id: resume_sync_check
        env:
          RESUME_TOKEN: ${{ secrets.RESUME_READ_TOKEN }}
        run: |
          if [ -n "$RESUME_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Resume sync ENABLED — pulling latest from gupta-kush/kush-gupta-resume"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "RESUME_READ_TOKEN not set — using committed public/resume.pdf as fallback"
          fi

      - name: Sync resume PDF from private repo
        if: steps.resume_sync_check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: gupta-kush/kush-gupta-resume
          token: ${{ secrets.RESUME_READ_TOKEN }}
          path: .resume-src
          sparse-checkout: |
            Kush_Gupta_resume.pdf
          sparse-checkout-cone-mode: false

      - name: Stage resume into public/
        if: steps.resume_sync_check.outputs.enabled == 'true'
        run: |
          cp .resume-src/Kush_Gupta_resume.pdf public/resume.pdf
          rm -rf .resume-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
