# Copy this file to gupta-kush/kush-gupta-resume at the path
# `.github/workflows/notify-portfolio.yml`.
#
# Requires a repo secret named RESUME_SYNC_TOKEN — a fine-grained PAT
# with Contents: Read and write on both gupta-kush/dev-portfolio and
# gupta-kush/kush-gupta-resume. See docs/resume-sync-setup.md in the
# portfolio repo for the full setup.

name: Notify portfolio of resume update

on:
  push:
    paths:
      - Kush_Gupta_resume.pdf
    branches: [main]

# Workflow only fires an API call at the portfolio repo; it doesn't
# touch this repo's contents.
permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch at portfolio
        env:
          GH_TOKEN: ${{ secrets.RESUME_SYNC_TOKEN }}
        run: |
          curl -sSL --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/gupta-kush/dev-portfolio/dispatches \
            -d '{"event_type":"resume-updated"}'
